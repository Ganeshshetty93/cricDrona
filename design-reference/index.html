</style></head><body><div id="app"></div><div id="overlay"></div><button class="motion-control" onclick="toggleMotion(this)" aria-pressed="false">Ⅱ Pause animation</button><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='dashboard',mode='player',filter='All events';let state=JSON.parse(localStorage.getItem('cricdrona-night-v1')||'null')||{name:'Arjun Sharma',email:'arjun@example.com',phone:'',dob:'2011-05-18',role:'All-rounder',interest:'Both',regs:[],batches:[],admins:[],events:[{id:1,title:'Weekend Warriors Cup',type:'Match',ball:'Tennis ball',age:'Open',date:'2026-11-01',time:'07:00',place:'Drona Cricket Ground',fee:499,seats:24},{id:2,title:'Junior Champions Academy',type:'Class',ball:'Hard ball',age:'Under 14',date:'2026-11-03',time:'16:00',place:'Drona Training Nets',fee:2499,seats:16},{id:3,title:'Leather Ball Premier League',type:'Match',ball:'Hard ball',age:'Under 19',date:'2026-11-08',time:'08:00',place:'Drona Cricket Ground',fee:799,seats:32},{id:4,title:'Tennis Ball Fundamentals',type:'Class',ball:'Tennis ball',age:'Under 16',date:'2026-11-05',time:'17:00',place:'Drona Training Nets',fee:1499,seats:20}]};function save(){localStorage.setItem('cricdrona-night-v1',JSON.stringify(state))}function toast(t){let a=document.createElement('div');a.className='toast';a.textContent=t;document.body.append(a);setTimeout(()=>a.remove(),3000)}
const logo='<div class="brand"><span class="mark">CD</span>CricDrona<span style="color:#88a744">.</span></div>';
function art(kind){return kind==='Match'?`<svg viewBox="0 0 500 200" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g"><stop stop-color="#426454"/><stop offset="1" stop-color="#a6b789"/></linearGradient></defs><rect width="500" height="200" fill="url(#g)"/><ellipse cx="260" cy="210" rx="260" ry="120" fill="#6d8a4d"/><ellipse cx="250" cy="190" rx="150" ry="70" fill="none" stroke="#dbe3c2" stroke-width="2"/><path d="M220 110h45l35 110h-105z" fill="#c6b78c"/><path d="M0 62Q240 -10 500 62M0 77Q240 5 500 77" fill="none" stroke="#e4e8da55" stroke-width="6"/><g fill="#274737"><circle cx="353" cy="86" r="13"/><path d="M344 100l-15 47 24 7 17-46z"/><path d="M340 145l-15 50h13l20-42 17 41h14l-24-51z"/><path d="M347 106l-35 22-28-38-7 6 28 47 52-18z"/></g><path d="M280 87l-28-40" stroke="#d8c29a" stroke-width="11"/><circle cx="183" cy="58" r="4" fill="#f7f4d7"/></svg>`:`<svg viewBox="0 0 500 200" preserveAspectRatio="xMidYMid slice"><rect width="500" height="200" fill="#d4d9c6"/><path d="M0 130h500v70H0z" fill="#7c915c"/><path d="M0 145h500M0 170h500M45 0v200M100 0v200M155 0v200M210 0v200M265 0v200M320 0v200M375 0v200M430 0v200M485 0v200M0 25h500M0 55h500M0 85h500M0 115h500" stroke="#3e5a4340" fill="none"/><path d="M190 200l37-90h40l46 90" fill="#c1b28d"/><g fill="#f4f2e7"><circle cx="262" cy="67" r="14"/><path d="M250 83l-10 48 41 2-8-49z"/><path d="M243 126l-8 74h15l13-59 14 59h15l-11-72z"/><path d="M253 87l-19 20 12 15 30-19-6-10-23 14"/></g><path d="M239 115l-29 60" stroke="#ad8f5f" stroke-width="10"/><path d="M310 128v45m7-45v45m7-45v45m-16-46h19" stroke="#efe8cc" stroke-width="3"/></svg>`}
const batter=`<svg viewBox="0 0 340 330"><circle cx="201" cy="72" r="28" fill="#dce8bd"/><path d="M170 64q10-45 50-18l13 22-58 5" fill="#a9c65c"/><path d="M177 87l-31 72 62 35 36-67-17-39z" fill="#e6ebdb"/><path d="M157 106l-55-29-34-49-15 9 29 62 62 36" fill="#d7dfc9"/><path d="M213 110l-68-31-51-47-14 14 52 56 69 40" fill="#fff"/><path d="M148 160l-37 68-56 46 16 16 73-48 36-54 8 62 54 66 22-13-46-70-9-55z" fill="#bacb98"/><path d="M51 276l-23 19 8 11 42-16M238 303l9 21h46l-5-12-32-14" fill="#f1f1df"/><path d="M76 36L27 0" stroke="#d1b77a" stroke-width="16"/><path d="M13 295h310" stroke="#bed36a" stroke-width="2"/><circle cx="293" cy="93" r="11" fill="#d7f264"/><path d="M287 84q10 7 12 16" fill="none" stroke="#536c29"/></svg>`;
function go(p){page=p;render();window.scrollTo(0,0)}function switchMode(){mode=mode==='player'?'admin':'player';page='dashboard';render()}function dashboardRender(){let admin=mode==='admin';let nav=admin?[['dashboard','◫','Overview'],['events','◉','Matches & classes'],['players','♙','Registrations'],['batches','▦','Batches'],['access','⚿','Admin access']]:[['dashboard','◫','My dashboard'],['events','◉','Explore events'],['registrations','▣','My registrations'],['profile','♙','My profile']];$('#app').innerHTML=`<header>${logo}<nav><a onclick="mode='player';go('dashboard')" class="${!admin?'active':''}">The clubhouse</a><a onclick="mode='player';go('events')">Matches & classes</a><a onclick="go('profile')">Player profile</a></nav><div class="top-actions"><span class="demo">INTERACTIVE DESIGN DEMO</span><button class="btn light small" onclick="switchMode()">${admin?'Player view':'Admin view'} ↗</button><button class="avatar" aria-label="Open profile" onclick="go('profile')">${esc(state.name.charAt(0))}</button></div></header><div class="shell"><aside><div class="label">${admin?'ACADEMY MANAGEMENT':'PLAYER CLUBHOUSE'}</div>${nav.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${i} <span>${t}</span></button>`).join('')}<div class="bottom"><div class="help"><b>Your next innings<br>starts here.</b>A little practice. A lot of passion.<br><a onclick="go('events')" style="font-weight:bold;color:#476736">Find your game ↗</a></div><button onclick="logout()">↪ <span>Log out</span></button></div></aside><main>${admin?adminContent():playerContent()}<footer><span>© 2026 CricDrona. Built for the love of cricket.</span><span>PLAY. LEARN. BELONG.</span></footer></main></div>`}
function head(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${mode==='admin'?'ADMIN WORKSPACE':'YOUR CRICKET JOURNEY'}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}function stats(admin=false){return `<div class="stats">${(admin?[[state.regs.length,'Registrations','♙'],[state.events.filter(e=>e.type==='Match').length,'Upcoming matches','⚑'],[state.events.filter(e=>e.type==='Class').length,'Coaching classes','▦'],[state.batches.length,'Active batches','◷']]:[[state.regs.length,'My registrations','▣'],[state.regs.filter(id=>state.events.find(e=>e.id===id)?.type==='Match').length,'Matches booked','⚑'],[state.regs.filter(id=>state.events.find(e=>e.id===id)?.type==='Class').length,'Classes enrolled','▦'],[state.interest==='Both'?'Both':state.interest,'My cricket preference','◉']]).map(([n,l,i])=>`<div class="stat"><div class="icon">${i}</div><div><strong>${n}</strong><small>${l}</small></div></div>`).join('')}</div>`}
function card(e){let reg=state.regs.includes(e.id);return `<article class="card"><div class="cover">${art(e.type)}<span class="badge">${esc(e.ball)}</span><span class="tag">${esc(e.age)}</span></div><div class="cardbody"><div class="type">${e.type==='Match'?'MATCH DAY • LIMITED SPOTS':'COACHING • LEARN WITH THE BEST'}</div><h3>${esc(e.title)}</h3><div class="details">▦ ${new Date(e.date+'T12:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} &nbsp; ◷ ${esc(e.time)}<br>⌖ ${esc(e.place)}</div><div class="cardfoot"><div><b>₹${Number(e.fee).toLocaleString('en-IN')}</b><small> / ${e.type==='Match'?'player':'month'}</small></div><button class="btn small ${reg?'light':''}" onclick="registerEvent(${e.id})">${reg?'Registered ✓':'Register now ↗'}</button></div></div></article>`}function filters(){return `<div class="tabs">${['All events','Matches','Classes','Tennis ball','Hard ball'].map(x=>`<button class="chip ${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div>`}function eventList(){return state.events.filter(e=>filter==='All events'||filter==='Matches'&&e.type==='Match'||filter==='Classes'&&e.type==='Class'||filter===e.ball)}
function playerContent(){if(page==='profile')return profile();if(page==='registrations')return head('My registrations','Your next matches and coaching sessions, all in one place.')+`<div class="cards">${state.events.filter(e=>state.regs.includes(e.id)).map(card).join('')||'<div class="panel empty">Your next innings is waiting.<br><br><button class="btn" onclick="go(\'events\')">Explore matches & classes</button></div>'}</div>`;if(page==='events')return head('Find your next innings','From your first net session to your next match-winning knock.')+filters()+`<div class="cards">${eventList().map(card).join('')}</div>`;return head(`Welcome to the crease, ${esc(state.name.split(' ')[0])} 👋`,'A new day. A new opportunity to raise your game.',`<button class="btn light" onclick="go('events')">Explore events ↗</button>`)+`<section class="hero"><div class="hero-copy"><div class="eyebrow">THE GAME IS CALLING</div><h2>Big dreams.<br>Start with <em>one innings.</em></h2><p>Find your team, sharpen your skills, and make every ball count. Your cricket journey starts here.</p><button class="btn lime" onclick="go('events')">Find your next game <span>↗</span></button></div><div class="hero-art">${batter}</div><div class="hero-badge">EST. 2026 &nbsp; • &nbsp; MADE FOR CRICKET</div></section>`+stats()+`<div class="layout"><section><div class="sectionhead"><h2>Step onto the field</h2><a onclick="go('events')">View all events ↗</a></div>${filters()}<div class="cards">${eventList().slice(0,2).map(card).join('')}</div></section><div class="right"><section class="panel"><div class="row"><h3>Your upcoming innings</h3><span>↗</span></div>${state.regs.length?state.events.filter(e=>state.regs.includes(e.id)).slice(0,3).map(e=>`<div class="schedule"><div class="date">NOV<b>${e.date.slice(-2)}</b></div><div><h4>${esc(e.title)}</h4><p>${esc(e.time)} · ${esc(e.ball)}<br>${esc(e.place)}</p></div></div>`).join(''):`<div class="schedule"><div class="date">LET'S<b>GO</b></div><div><h4>Your calendar is wide open</h4><p>Register for a match or class<br>to plan your next innings.</p></div></div>`}</section><section class="panel interest"><div class="eyebrow">MAKE IT YOUR GAME</div><h3 style="margin-top:8px">What's your cricket style?</h3><p>Tell us your preference to help find the right matches and coaching.</p><div class="tabs" style="margin:0">${['Tennis ball','Hard ball','Both'].map(x=>`<button class="chip ${state.interest===x?'active':''}" onclick="state.interest='${x}';save();render();toast('Cricket preference updated')">${x}</button>`).join('')}</div></section><section class="panel"><div class="row"><h3>Complete your player card</h3><b style="font-size:12px">${state.phone?'100%':'75%'}</b></div><div class="progress"><span style="width:${state.phone?'100':'75'}%"></span></div><p class="sub">A complete profile helps us find your best fit.</p><a onclick="go('profile')" style="display:block;margin-top:14px;font-size:11px;font-weight:bold">Update profile →</a></section></div></div>`}
function profile(){return head('Your player profile','Every great player has a story. Make this one yours.')+`<div class="profilehead"><div class="avatar">${esc(state.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div><div class="eyebrow" style="color:var(--lime)">CRICDRONA PLAYER CARD</div><h2>${esc(state.name)}</h2><p style="font-size:12px;color:#c5d3bf;margin-top:6px">${esc(state.role)} &nbsp; • &nbsp; ${esc(state.interest)} enthusiast</p></div></div><form class="panel" onsubmit="updateProfile(event)"><div class="sectionhead"><h2>Personal details</h2><span class="pill">Player</span></div><div class="formgrid">${field('Full name','name',state.name)}${field('Email address','email',state.email,'email')}${field('Phone number','phone',state.phone,'tel')}${field('Date of birth','dob',state.dob,'date')}<label>Playing role<select name="role">${['All-rounder','Batter','Bowler','Wicketkeeper'].map(x=>`<option ${x===state.role?'selected':''}>${x}</option>`).join('')}</select></label><label>Preferred cricket<select name="interest">${['Tennis ball','Hard ball','Both'].map(x=>`<option ${x===state.interest?'selected':''}>${x}</option>`).join('')}</select></label></div><button class="btn" style="margin-top:24px">Save profile changes ↗</button></form>`}function field(l,n,v='',type='text',required=true){return `<label>${l}<input name="${n}" type="${type}" value="${esc(v)}" ${required?'required':''}></label>`}function updateProfile(e){e.preventDefault();Object.assign(state,Object.fromEntries(new FormData(e.target)));save();render();toast('Your player profile is updated')}
function adminContent(){if(page==='profile')return profile();if(page==='events')return head('Matches & coaching classes','Create opportunities for every age group and every kind of cricket.',`<button class="btn" onclick="createEvent()">＋ Create event</button>`)+`<div class="panel tablewrap">${eventTable()}</div>`;if(page==='players')return head('Player registrations','Review player interests and assign coaching registrations to a batch.')+`<div class="panel tablewrap"><table><thead><tr><th>Player</th><th>Event</th><th>Age group</th><th>Ball preference</th><th>Batch</th></tr></thead><tbody>${state.regs.map(id=>{let e=state.events.find(x=>x.id===id);return `<tr><td><b>${esc(state.name)}</b><br><span class="sub">${esc(state.email)}</span></td><td>${esc(e.title)}</td><td>${esc(e.age)}</td><td>${esc(state.interest)}</td><td>${e.type==='Class'?`<select aria-label="Assign batch" onchange="assign(${id},this.value)"><option value="">Assign batch</option>${state.batches.filter(b=>b.age===e.age&&b.ball===e.ball).map(b=>`<option ${state['batch'+id]===b.name?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`:'<span class="pill">Match player</span>'}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No registrations yet. Try registering in Player view.</td></tr>'}</tbody></table></div>`;if(page==='batches')return head('Coaching batches','Group players by age, ball type, and training schedule.',`<button class="btn" onclick="batchModal()">＋ Create batch</button>`)+`<div class="cards">${state.batches.map(b=>`<div class="panel"><span class="pill">${esc(b.age)} · ${esc(b.ball)}</span><h3 style="margin-top:20px">${esc(b.name)}</h3><p class="details">Coach: ${esc(b.coach)}<br>${esc(b.schedule)}<br>Capacity: ${esc(b.capacity)} players</p></div>`).join('')||'<div class="panel empty">Create your first coaching batch to start assigning players.</div>'}</div>`;if(page==='access')return head('Team & admin access','Design who manages your academy. This demo simulates permissions locally.',`<button class="btn" onclick="accessModal()">＋ Add team member</button>`)+`<div class="panel tablewrap"><table><thead><tr><th>Team member</th><th>Role</th><th>Permissions</th><th>Action</th></tr></thead><tbody><tr><td>Academy owner</td><td><span class="pill">Owner</span></td><td>All management & access controls</td><td>—</td></tr>${state.admins.map((a,i)=>`<tr><td>${esc(a.email)}</td><td>${esc(a.role)}</td><td>${a.role==='Admin'?'Events, players & batches':'Classes & batches'}</td><td><button class="btn light small" onclick="state.admins.splice(${i},1);save();render();toast('Demo access removed')">Remove</button></td></tr>`).join('')}</tbody></table></div>`;return head('The academy, at a glance.','Good cricket starts with great management.',`<button class="btn" onclick="createEvent()">＋ Create event</button>`)+`<section class="hero" style="min-height:200px"><div class="hero-copy"><div class="eyebrow">BUILD THE NEXT GENERATION</div><h2>Your ground.<br><em>Their great beginning.</em></h2><p>Manage matches, nurture talent, and keep every batch moving forward.</p></div><div class="hero-art">${batter}</div></section>`+stats(true)+`<div class="panel"><div class="sectionhead"><h2>Upcoming matches & classes</h2><a onclick="go('events')">Manage all ↗</a></div><div class="tablewrap">${eventTable()}</div></div><div class="cards"><div class="panel"><h3>Build your coaching batches</h3><p class="details" style="margin:12px 0">Organise Under 10, Under 12, Under 14, Under 16, Under 19 and adult players.</p><button class="btn light small" onclick="go('batches')">Manage batches ↗</button></div><div class="panel interest"><h3>A team behind every team</h3><p class="details" style="margin:12px 0">Add administrators and coaches to help run your academy.</p><button class="btn small" onclick="go('access')">Manage team access ↗</button></div></div>`}
function eventTable(){return `<table><thead><tr><th>Event / class</th><th>Format</th><th>Age group</th><th>Date</th><th>Registrations</th></tr></thead><tbody>${state.events.map(e=>`<tr><td><b>${esc(e.title)}</b><br><span class="sub">${esc(e.type)}</span></td><td>${esc(e.ball)}</td><td><span class="pill">${esc(e.age)}</span></td><td>${esc(e.date)}</td><td>${state.regs.includes(e.id)?1:0} / ${e.seats}</td></tr>`).join('')}</tbody></table>`}function modal(html){$('#overlay').innerHTML=`<div class="modalback"><div class="modal"><button aria-label="Close dialog" style="float:right;background:none;font-size:23px" onclick="closeModal()">×</button>${html}</div></div>`}function closeModal(){$('#overlay').innerHTML=''}
function registerEvent(id){if(!loggedIn){pendingEvent=id;auth('Register');return}let e=state.events.find(e=>e.id===id);if(state.regs.includes(id)){toast('You are already registered for this event');return}modal(`<div class="eyebrow">YOUR NEXT INNINGS</div><h2>${esc(e.title)}</h2><p class="details">${esc(e.ball)} · ${esc(e.age)}<br>${esc(e.date)} at ${esc(e.time)}<br>${esc(e.place)}</p><form onsubmit="confirmRegistration(event,${id})"><p style="margin:18px 0;font-size:12px">Registering as <b>${esc(state.name)}</b>. ${e.age!=='Open'?'Your birth date will be checked against the age category.':''}</p><label><input required type="checkbox" style="width:auto;display:inline;margin-right:8px">I confirm my details and agree to participate.</label><p class="sub">Design preview: no payment will be taken.</p><button class="btn">Confirm registration · ₹${e.fee} ↗</button></form>`)}function confirmRegistration(ev,id){ev.preventDefault();let e=state.events.find(x=>x.id===id);let age=(new Date(e.date)-new Date(state.dob))/31557600000;let max=Number(e.age.replace('Under ',''));if(max&&age>=max){toast('Your profile age does not meet this event category');return}state.regs.push(id);save();closeModal();render();toast('You’re in! Registration confirmed')}
function ageOptions(){return ['Under 10','Under 12','Under 14','Under 16','Under 19','Adults','Open'].map(x=>`<option>${x}</option>`).join('')}function createEvent(){modal(`<div class="eyebrow">ADMIN • NEW OPPORTUNITY</div><h2>Bring cricket to life.</h2><form onsubmit="saveEvent(event)">${field('Event / class name','title')}<div class="formgrid"><label>Event type<select name="type"><option>Match</option><option>Class</option></select></label><label>Ball type<select name="ball"><option>Tennis ball</option><option>Hard ball</option></select></label><label>Age category<select name="age">${ageOptions()}</select></label>${field('Player capacity','seats',24,'number')}${field('Start date','date','2026-11-15','date')}${field('Start time','time','07:00','time')}</div>${field('Venue','place')}${field('Fee in ₹','fee',0,'number')}<button class="btn">Create event ↗</button></form>`)}function saveEvent(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.id=Date.now();v.fee=Number(v.fee);v.seats=Number(v.seats);if(v.seats<1||v.fee<0)return toast('Please enter a valid capacity and fee');state.events.push(v);save();closeModal();go('events');toast('Event created and available to players')}
function batchModal(){modal(`<div class="eyebrow">ACADEMY COACHING</div><h2>Create a training batch</h2><form onsubmit="saveBatch(event)">${field('Batch name','name')}${field('Coach name','coach')}<div class="formgrid"><label>Age category<select name="age">${ageOptions()}</select></label><label>Ball type<select name="ball"><option>Tennis ball</option><option>Hard ball</option></select></label></div>${field('Schedule','schedule','Mon, Wed, Fri · 4:00–5:30 PM')}${field('Maximum players','capacity',16,'number')}<button class="btn">Create batch ↗</button></form>`)}function saveBatch(e){e.preventDefault();let b=Object.fromEntries(new FormData(e.target));if(+b.capacity<1)return toast('Capacity must be at least one');state.batches.push(b);save();closeModal();render();toast('Training batch created')}function assign(id,value){state['batch'+id]=value;save();toast(value?'Player assigned to '+value:'Batch assignment removed')}
function accessModal(){modal(`<div class="eyebrow">TEAM MANAGEMENT</div><h2>Add an academy teammate</h2><p class="details">Preview the team access flow. No invitation is sent and no real access is granted.</p><form onsubmit="saveAdmin(event)">${field('Email address','email','','email')}<label>Access role<select name="role"><option>Admin</option><option>Coach</option></select></label><button class="btn">Add demo team member ↗</button></form>`)}function saveAdmin(e){e.preventDefault();let a=Object.fromEntries(new FormData(e.target));if(state.admins.some(x=>x.email===a.email))return toast('Team member already added');state.admins.push(a);save();closeModal();render();toast('Demo team member added')}
function auth(kind){modal(`<div class="eyebrow">WELCOME TO CRICDRONA</div><h2>${kind==='Login'?'Your next innings awaits.':'Become part of the game.'}</h2><p class="details">Interactive design demo. Use a player name to personalise your clubhouse. Secure account authentication is not connected.</p><form onsubmit="demoLogin(event)">${kind==='Register'?field('Full name','name',''):''}${field('Email address','email','','email')}<button class="btn">${kind==='Login'?'Enter demo clubhouse':'Create demo player profile'} ↗</button></form><p class="sub" style="margin-top:20px"><a onclick="auth('${kind==='Login'?'Register':'Login'}')">${kind==='Login'?'New player? Register here →':'Already a player? Login →'}</a></p>`)}function demoLogin(e){e.preventDefault();loggedIn=true;sessionStorage.setItem('cricdrona-night-session','1');let v=Object.fromEntries(new FormData(e.target));Object.assign(state,v);save();closeModal();mode='player';go('dashboard');toast('Welcome to your demo clubhouse');if(pendingEvent){let id=pendingEvent;pendingEvent=null;registerEvent(id)}}
function toggleMotion(button){let paused=document.body.classList.toggle('motion-paused');button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'▷ Play animation':'Ⅱ Pause animation'}
let loggedIn=sessionStorage.getItem('cricdrona-night-session')==='1',publicPage='home',pendingEvent=null;
function publicGo(p){publicPage=p;render();window.scrollTo(0,0)}
function logout(){loggedIn=false;sessionStorage.removeItem('cricdrona-night-session');mode='player';page='dashboard';publicPage='home';render();toast('You have left the demo clubhouse')}
function render(){if(loggedIn){dashboardRender();return}renderPublic()}
function publicTitle(title,desc,kicker='THE CRICDRONA CLUBHOUSE'){return `<div class="public-title"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>`}
function renderPublic(){document.title='CricDrona — '+({home:'Find your next innings',about:'About us',contact:'Contact',events:'Matches & classes'}[publicPage]);$('#app').innerHTML=`<header class="public-header"><a onclick="publicGo('home')" aria-label="CricDrona home">${logo}</a><nav>${[['home','Home'],['about','About us'],['events','Events'],['contact','Contact']].map(([p,t])=>`<a class="${publicPage===p?'active':''}" onclick="publicGo('${p}')">${t}</a>`).join('')}</nav><div class="top-actions"><button class="btn light" onclick="auth('Login')">Log in</button><button class="btn" onclick="auth('Register')">Join the club ↗</button></div></header><main class="public-main">${publicPage==='home'?publicHome():publicPage==='about'?publicAbout():publicPage==='events'?publicEvents():publicContact()}</main><div class="public-footer"><div class="footer-inner"><div>${logo}<p>A place to play. A space to grow.<br>For the love of the game.</p></div><div class="links"><a onclick="publicGo('about')">About us</a><a onclick="publicGo('events')">Matches & classes</a><a onclick="publicGo('contact')">Contact</a><a onclick="auth('Login')">Player login</a></div></div><footer style="max-width:1190px;margin:auto"><span>© 2026 CricDrona. All rights reserved.</span><span>PLAY. LEARN. BELONG.</span></footer></div>`}
function publicHome(){return `<section class="public-hero"><div><div class="eyebrow">YOUR GAME. UNDER THE LIGHTS.</div><div class="night-label"><i></i> THE NIGHT STADIUM EDITION</div><h1>Own the<br>moment.<br><em>Play bold.</em></h1><p>Big hits. Bright lights. From tennis-ball thrills to hard-ball challenges. Discover matches, join a coaching class, and find your place in the game.</p><div class="actions"><button class="btn" onclick="publicGo('events')">Explore matches & classes ↗</button><button class="btn light" onclick="publicGo('about')">Meet CricDrona</button></div><div style="font-size:11px;color:#7d896f">Tennis ball & hard ball &nbsp; / &nbsp; Junior to adult cricket</div></div><div class="public-art"><div class="hero-badge">THE STAGE IS YOURS. MAKE IT COUNT.</div>${batter}<div class="floating-note"><div><b>There's a game for you.</b><small>Find your format. Build your confidence.</small></div><button class="avatar" onclick="publicGo('events')" aria-label="Explore events">↗</button></div></div></section><div class="ribbon"><span>◉ &nbsp; TENNIS & HARD BALL</span><span>▦ &nbsp; AGE-BASED COACHING</span><span>⚑ &nbsp; MATCHES & TOURNAMENTS</span><span>↗ &nbsp; ONE CRICKET COMMUNITY</span></div><section class="public-section"><div class="sectionhead"><div><div class="eyebrow">FIND YOUR NEXT INNINGS</div><h2 style="margin-top:8px">Good cricket. Great company.</h2></div><a onclick="publicGo('events')">View all events ↗</a></div><div class="cards">${state.events.slice(0,3).map(card).join('')}</div><p class="sub" style="margin-top:14px">Illustrative events for this interactive design preview.</p></section><section class="public-section" style="padding-top:10px"><div class="sectionhead"><div><div class="eyebrow">TWO FORMATS. ONE PASSION.</div><h2 style="margin-top:8px">Play the way you love.</h2></div></div><div class="pathways"><article class="pathway"><div><div class="eyebrow">QUICK GAMES. BIG ENERGY.</div><h3>Tennis-ball cricket</h3><p>Enjoy the familiar thrill of the game, build your basics, and get out on the field.</p><a style="font-size:12px;font-weight:bold" onclick="filter='Tennis ball';publicGo('events')">Find tennis-ball events ↗</a></div><div class="ball"><span></span></div></article><article class="pathway"><div><div class="eyebrow">SHARPEN YOUR GAME.</div><h3>Hard-ball cricket</h3><p>Develop your technique through structured coaching and put your skills to the test.</p><a style="font-size:12px;font-weight:bold" onclick="filter='Hard ball';publicGo('events')">Find hard-ball events ↗</a></div><div class="ball hard"><span></span></div></article></div></section><section class="join-banner"><div><div class="eyebrow" style="color:var(--lime)">READY WHEN YOU ARE</div><h2>Don't just watch the game. Be in it.</h2><p>Create your player profile, choose your cricket style, and book your next innings.</p></div><button class="btn lime" onclick="auth('Register')">Create player profile ↗</button></section>`}
function publicEvents(){return publicTitle('The field is calling.','Explore upcoming matches and coaching classes. Find your ball type, age group, and next cricket experience.','MATCHES & COACHING')+`<section class="public-events">${filters()}<div class="cards">${eventList().map(card).join('')}</div><p class="sub" style="margin-top:18px">Browse freely. Log in or create a player profile to register. Events shown are illustrative demo content.</p></section>`}
function publicAbout(){return publicTitle('More than a game.<br>A place to belong.','CricDrona brings matches, coaching, and a community of players together around one shared love: cricket.','ABOUT CRICDRONA')+`<section class="story-grid"><div class="public-art">${batter}</div><div><div class="eyebrow">OUR PURPOSE</div><h2 style="margin-top:12px">Make room for every<br>kind of cricketer.</h2><p>Some players start with a tennis ball in a neighbourhood lane. Others find their rhythm in the nets. CricDrona is designed to help each player find a suitable next step.</p><p>Discover tennis-ball and hard-ball events, explore coaching by age category, and keep your registrations organised in your own player clubhouse.</p><button class="btn" onclick="publicGo('events')">Find your next step ↗</button></div></section><div class="values">${[['01','Play your format','Choose tennis-ball or hard-ball cricket and tell us what interests you.'],['02','Grow at your pace','Explore age-based classes, from junior groups through to adult sessions.'],['03','Stay connected','Keep your player details, coaching registrations, and matches together.']].map(([n,t,d])=>`<article class="panel"><div class="eyebrow">${n} / THE CRICDRONA WAY</div><h3>${t}</h3><p>${d}</p></article>`).join('')}</div><section class="join-banner"><div><h2>Your story starts at the crease.</h2><p>Take the first step towards your next innings.</p></div><button class="btn lime" onclick="auth('Register')">Join CricDrona ↗</button></section>`}
function publicContact(){return publicTitle('Let’s talk cricket.','Have a question about a match, a coaching class, or where to begin? Start a conversation with the academy.','CONTACT US')+`<section class="contact-layout"><div class="contact-info"><div class="eyebrow" style="color:var(--lime)">WE’RE ON YOUR TEAM</div><h2 style="margin-top:13px">A question today.<br>A great innings tomorrow.</h2><p>Ask about age categories, ball formats, coaching batches, or hosting a match.</p><h3>Looking for your next game?</h3><p>Every event includes its schedule, venue, ball format, and registration details.</p><button class="btn lime" onclick="publicGo('events')">Browse events ↗</button><p style="font-size:11px;margin-top:30px">Contact details and message delivery will be connected when the academy goes live.</p></div><form class="panel" onsubmit="contactPreview(event)"><h3 style="margin-bottom:22px">Send an enquiry</h3><div class="formgrid">${field('Your name','name')}${field('Email address','email','','email')}</div><label style="margin-top:18px">What can we help with?<select name="topic"><option>Coaching classes</option><option>Match registration</option><option>Age categories & batches</option><option>Hosting a match</option><option>Other enquiry</option></select></label><label style="margin-top:18px">Your message<textarea required name="message" rows="5" style="font:inherit;display:block;width:100%;margin-top:7px;border:1px solid var(--line);padding:12px;background:#fafbf7;border-radius:6px;resize:vertical" placeholder="Tell us a little about what you’re looking for..."></textarea></label><p class="sub" style="line-height:1.7;margin:16px 0">Design preview: this form lets you review your enquiry. Messages are not sent.</p><button class="btn">Review enquiry ↗</button></form></section>`}
function contactPreview(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));modal(`<div class="eyebrow">ENQUIRY PREVIEW</div><h2>Thanks, ${esc(v.name)}.</h2><p class="details">From: ${esc(v.email)}<br>Topic: ${esc(v.topic)}</p><p style="white-space:pre-wrap;line-height:1.8;margin:20px 0">${esc(v.message)}</p><p class="sub">This is a design preview. Your enquiry has not been sent.</p><button class="btn" onclick="closeModal()">Done</button>`)}

render();
</script></body></html>
